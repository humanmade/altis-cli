name: Release

# Publishes to npm when a GitHub Release is published.
# The release tag is the single source of truth for the version: it is stamped
# into package.json at publish time, so the version in git never needs bumping.
# Authenticates to npm as a trusted publisher via OIDC (no token needed).
# See RELEASING.md for the full process.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # Enables npm provenance.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Trusted publishing via OIDC requires npm >= 11.5.1; pin to latest to be safe.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Set version from release tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' is not a semver version (expected X.Y.Z or vX.Y.Z)."
            exit 1
          fi
          npm version "$tag" --no-git-tag-version
          echo "Publishing version $tag"

      - name: Smoke test
        run: npm run smoke

      - name: Security audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Publish to npm
        run: npm publish --provenance --access public
